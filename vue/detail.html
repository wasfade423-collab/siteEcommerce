<script>
  let div = document.getElementsByTagName('div')[0];

  let urls = ['../images/poto.jpg', '../images/base.png', '../images/petite.jpg', '../images/site.jpg'];
  let index = 1;

  function setbg(){
    div.style.backgroundImage = "url('"+urls[index]+"')";
    index++;
    if(index>=urls.length){
      index=0;
    }
  } 
  setInterval(setbg, 2000);
</script>
